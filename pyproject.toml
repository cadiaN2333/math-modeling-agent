[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-modeling-agent"
version = "0.1.0"
description = "可验证的数学建模 Agent"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
agent = ["openai", "python-dotenv>=1.0"]
energy = ["openpyxl>=3.1"]
rag = [
    "langchain-chroma>=0.1.2",
    "langchain-huggingface>=0.1.2",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
]
langchain = [
    "langchain>=1.0,<2",
    "langchain-deepseek>=1.1,<2",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
